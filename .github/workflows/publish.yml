name: Publish Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Publish public workspaces
        run: |
          npm publish -w @codb/core --access public
          npm publish -w @codb/image --access public
          npm publish -w @codb/pdf --access public
          npm publish -w @codb/office --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
